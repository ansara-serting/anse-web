    <div id="blok-a11y" class="global-floating top-right">

        </div>
        <a href="#seksyen-footer" class="btn-sitemap">▶ Peta laman sesawang ini</a>

            <button id="btn-text-size" class="btn-a11y" type="button" aria-label="Tetapan saiz teks" aria-controls="popover-a11y" aria-expanded="false">^A</button>
            <div id="popover-a11y" class="popover hidden" aria-hidden="true">
                <button type="button" aria-label="Saiz teks kecil" onclick="ubahSaizTeks('kecil')">A-</button>
                <button type="button" aria-label="Saiz teks asal" onclick="ubahSaizTeks('asal')">A</button>
                <button type="button" aria-label="Saiz teks besar" onclick="ubahSaizTeks('besar')">A+</button>
            </div>
        </div>
    </div>

        <div class="drawer-header">

        <div class="drawer-footer">

            <button id="toggle-tema" type="button" aria-label="Tukar tema">Tukar Tema 🌓</button>
            <br><br>
            <a href="#">Hubungi webmaster ></a>
        </div>
    </nav>
    <div id="drawer-backdrop" class="drawer-backdrop hidden" aria-hidden="true"></div>

                    </div>
                </div>
