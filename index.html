<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANSARA Serting - Persatuan Bekas Pelajar MRSM Serting</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="blok-a11y" class="global-floating top-right">
        <!-- BLOK GLOBAL 4: Butang Menu (Hamburger) -->
        <div id="blok-menu-utama" class="global-floating top-left">
            <button id="btn-hamburger" class="btn-hamburger" onclick="bukaDrawer()" aria-label="Buka Menu">
                ☰
            </button>
        </div>
        <a href="#peta-laman" class="btn-sitemap">▶ Peta laman sesawang ini</a>
        <div class="a11y-wrapper">
            <button id="btn-text-size" class="btn-a11y">^A</button>
            <div id="popover-a11y" class="popover hidden">
                <button onclick="ubahSaizTeks('kecil')">A-</button>
                <button onclick="ubahSaizTeks('asal')">A</button>
                <button onclick="ubahSaizTeks('besar')">A+</button>
            </div>
        </div>
    </div>

    <nav id="side-drawer" class="drawer hidden">
        <div class="drawer-header">
            <h2>ANSARASERTING</h2>
            <button id="btn-tutup-drawer">X</button>
        </div>
        <ul class="drawer-menu">
            <li><a href="#">ANSE</a></li>
            <li><a href="#">Buku Gambar</a></li>
            <li><a href="#">Keahlian</a></li>
            <li><a href="#">Hubungi Kami</a></li>
            <li><a href="#">Berita</a></li>
            <li><a href="#">Sumbangan</a></li>
        </ul>
        <div class="drawer-footer">
            <p>Tetapan</p>
            <button id="toggle-tema">Tukar Tema 🌓</button>
            <br><br>
            <a href="#">Hubungi webmaster ></a>
        </div>
    </nav>
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

    <main id="scroll-container">
        
        <section id="seksyen-navigasi" class="full-screen bg-navigasi">
            <div class="nav-wrapper">
                
        <!-- Kiri: Highlight Grid (Latar Berita Boleh Klik) -->
                <div class="highlight-grid" id="highlight-grid-container">
                    <!-- Data JSON highlight akan disuntik secara dinamik di sini oleh main.js -->
                </div>

        <!-- Kanan: Grid Menu (2x2) -->
                <div class="grid-menu-container">
                    <!-- Grid 2x2 -->
                    <div class="grid-menu-4">
                        <!-- Data JSON kad menu akan disuntik secara dinamik di sini oleh main.js -->
                    </div>
                </div>

            </div>
        </section>

 <!-- SEKSYEN 2: CAROUSEL PROGRAM & SUMBANGAN -->
        <section id="seksyen-carousel" class="full-screen">
            <div class="carousel-wrapper">
                
                <!-- OVERLAY SOSIAL MEDIA (Shield) -->
                <div class="social-block-overlay">
                    <div class="social-shield-bg">
                        <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                            <path d="M0,0 H200 V140 C200,210 150,240 100,240 C50,240 0,210 0,140 Z" fill="rgba(255, 255, 255, 0.9)"/>
                        </svg>
                    </div>
                    <div class="social-content">
                        <span class="social-title">Sey 💛 ANSE</span>
                        <span class="social-subtitle">Apo kobar eh jang?<br>Meh "follow"</span>
                        <div class="social-icons">
                            <a href="#" aria-label="Facebook">
                                <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
                            </a>
                            <a href="#" aria-label="Instagram">
                                <svg viewBox="0 0 24 24"><path d="M12 2c2.717 0 3.056.01 4.122.06 1.065.05 1.79.217 2.428.465.66.254 1.216.598 1.772 1.153a4.908 4.908 0 011.153 1.772c.247.637.415 1.363.465 2.428.047 1.066.06 1.405.06 4.122 0 2.717-.01 3.056-.06 4.122-.05 1.065-.218 1.79-.465 2.428a4.883 4.883 0 01-1.153 1.772 4.915 4.915 0 01-1.772 1.153c-.637.247-1.363.415-2.428.465-1.066.047-1.405.06-4.122.06-2.717 0-3.056-.01-4.122-.06-1.065-.05-1.79-.218-2.428-.465a4.89 4.89 0 01-1.772-1.153 4.904 4.904 0 01-1.153-1.772c-.248-.637-.415-1.363-.465-2.428C2.013 15.056 2 14.717 2 12c0-2.717.01-3.056.06-4.122.05-1.066.217-1.79.465-2.428a4.88 4.88 0 011.153-1.772A4.897 4.897 0 015.45 2.525c.638-.248 1.362-.415 2.428-.465C8.944 2.013 9.283 2 12 2zm0 5a5 5 0 100 10 5 5 0 000-10zm0 8.25a3.25 3.25 0 110-6.5 3.25 3.25 0 010 6.5zm5.32-6.638a1.18 1.18 0 10-2.36 0 1.18 1.18 0 002.36 0z"/></svg>
                            </a>
                            <a href="#" aria-label="TikTok">
                                <svg viewBox="0 0 24 24"><path d="M12.53 0c1.31 0 2.61 0 3.91.04.15 1.53.85 3.06 1.99 4.14 1.15 1.09 2.69 1.7 4.25 1.74v4.06c-1.89-.01-3.76-.56-5.36-1.55v7.26c-.02 2.37-1.12 4.62-3.03 6.06-1.92 1.45-4.4 1.94-6.67 1.32-2.26-.62-4.14-2.27-5.07-4.44-.92-2.17-.81-4.72.3-6.81 1.12-2.1 3.12-3.64 5.4-4.16 2.29-.52 4.75-.07 6.64 1.22v-4.5c-3.41-.95-7.14-.26-9.98 1.92-2.84 2.18-4.59 5.56-4.66 9.07-.06 3.5 1.58 6.94 4.34 9.21 2.75 2.27 6.46 3.1 9.9 2.23 3.44-.88 6.36-3.1 7.9-6.07 1.54-2.98 1.76-6.5.6-9.66V0h-4.42z"/></svg>
                            </a>
                        </div>
                    </div>
                </div>
                
                <!-- Butang Navigasi Kiri/Kanan -->
                <button class="carousel-btn prev-btn" id="carousel-prev" aria-label="Slaid Sebelumnya">❮</button>
                
                <!-- Bekas Trek Carousel (Data JSON akan masuk sini) -->
                <div class="carousel-track" id="carousel-track">
                    <!-- Placeholder sementara -->
                    <div class="carousel-slide" style="display:flex; justify-content:center; align-items:center; height:100%;">
                        <h2>Memuatkan Program...</h2>
                    </div>
                </div>

                <button class="carousel-btn next-btn" id="carousel-next" aria-label="Slaid Seterusnya">❯</button>
                
                <!-- Titik Penunjuk (Dots) -->
                <div class="carousel-dots" id="carousel-dots">
                    <!-- Dots akan dijana oleh JS -->
                </div>
                
            </div>
        </section>

<!-- SEKSYEN 3: FAKTA & TRIVIA -->
        <section id="seksyen-trivia" class="full-screen">
            <div class="trivia-wrapper" id="trivia-container">
                <!-- Data JSON akan disuntik di sini -->
                <h2>Memuatkan Fakta...</h2>
            </div>
            
            <!-- Ikon Tiga Segi Bawah (Penunjuk Skrol) -->
            <div class="trivia-scroll-indicator">▼</div>
        </section>        

<!-- SEKSYEN 4: FOOTER & PETA -->
        <section id="seksyen-footer" class="full-screen">
            <!-- Lapisan 1: Peta Latar Belakang -->
            <div id="footer-map-container" class="footer-map"></div>

            <!-- Lapisan 2: Panel Info Korporat di Bawah -->
            <div class="footer-panel" id="footer-info-container">
                <h2>Memuatkan Maklumat...</h2>
            </div>
        </section>

    </main>

    <div id="blok-indikator" class="global-floating bottom-center">
        <a href="#seksyen-carousel" id="btn-scroll-indicator" class="indicator-arrow">▼</a>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
